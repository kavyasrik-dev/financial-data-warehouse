version: 2

models:
  - name: int_customer_scd_events
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: effective_from
        tests:
          - not_null
      - name: effective_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
      - name: record_hash
        tests:
          - not_null
      - name: source_record_id
        tests:
          - not_null
          - unique

  - name: dim_customer
    columns:
      - name: customer_sk
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: customer_name_masked
        tests:
          - not_null
      - name: email_masked
        tests:
          - not_null
      - name: phone_masked
        tests:
          - not_null
      - name: customer_status
        tests:
          - not_null
          - accepted_values:
              values: ["active", "inactive"]
      - name: effective_from
        tests:
          - not_null
      - name: effective_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
      - name: record_hash
        tests:
          - not_null

  - name: dim_card
    columns:
      - name: card_sk
        tests:
          - not_null
          - unique
      - name: card_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: masked_card_number
        tests:
          - not_null
      - name: card_type
        tests:
          - not_null
          - accepted_values:
              values: ["debit", "credit", "prepaid"]
      - name: expiry_date
        tests:
          - not_null
      - name: card_status
        tests:
          - not_null
          - accepted_values:
              values: ["active", "blocked", "expired"]

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null
          - unique
      - name: day
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: year
        tests:
          - not_null
      - name: week
        tests:
          - not_null
      - name: day_of_week
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7]
      - name: day_name
        tests:
          - not_null
      - name: month_name
        tests:
          - not_null
      - name: is_weekend
        tests:
          - not_null

  - name: fact_transactions
    columns:
      - name: transaction_sk
        tests:
          - not_null
          - unique
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: customer_sk
        tests:
          - not_null
      - name: card_sk
        tests:
          - not_null
      - name: date_key
        tests:
          - not_null
      - name: transaction_timestamp
        tests:
          - not_null
      - name: transaction_type
        tests:
          - not_null
          - accepted_values:
              values: ["payment", "refund", "transfer"]
      - name: transaction_status
        tests:
          - not_null
          - accepted_values:
              values: ["success", "failed", "pending"]
      - name: amount
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: merchant_name
        tests:
          - not_null
      - name: merchant_category
        tests:
          - not_null
