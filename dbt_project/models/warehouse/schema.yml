version: 2

models:
  - name: int_customer_scd_events
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: effective_from
        tests:
          - not_null
      - name: effective_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
      - name: record_hash
        tests:
          - not_null
      - name: source_record_id
        tests:
          - not_null
          - unique

  - name: dim_customer
    columns:
      - name: customer_sk
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: customer_name_masked
        tests:
          - not_null
      - name: email_masked
        tests:
          - not_null
      - name: phone_masked
        tests:
          - not_null
      - name: customer_status
        tests:
          - not_null
          - accepted_values:
              values: ["active", "inactive"]
      - name: effective_from
        tests:
          - not_null
      - name: effective_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
      - name: record_hash
        tests:
          - not_null

  - name: dim_card
    columns:
      - name: card_sk
        tests:
          - not_null
          - unique
      - name: card_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: masked_card_number
        tests:
          - not_null
      - name: card_type
        tests:
          - not_null
          - accepted_values:
              values: ["debit", "credit", "prepaid"]
      - name: expiry_date
        tests:
          - not_null
      - name: card_status
        tests:
          - not_null
          - accepted_values:
              values: ["active", "blocked", "expired"]
