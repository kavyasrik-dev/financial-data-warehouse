version: 2

models:
  - name: mart_daily_transaction_metrics
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null
      - name: total_transactions
        tests:
          - not_null
      - name: total_transaction_amount
        tests:
          - not_null
      - name: average_transaction_amount
        tests:
          - not_null
      - name: successful_transactions
        tests:
          - not_null
      - name: failed_transactions
        tests:
          - not_null

  - name: mart_customer_activity
    columns:
      - name: customer_sk
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: customer_name_masked
        tests:
          - not_null
      - name: total_transactions
        tests:
          - not_null
      - name: total_transaction_amount
        tests:
          - not_null
      - name: average_transaction_amount
        tests:
          - not_null
      - name: first_transaction_at
        tests:
          - not_null
      - name: last_transaction_at
        tests:
          - not_null

  - name: mart_transaction_summary
    columns:
      - name: merchant_category
        tests:
          - not_null
      - name: transaction_type
        tests:
          - not_null
      - name: transaction_status
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: total_transactions
        tests:
          - not_null
      - name: total_transaction_amount
        tests:
          - not_null
      - name: average_transaction_amount
        tests:
          - not_null
